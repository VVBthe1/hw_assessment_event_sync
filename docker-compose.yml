services:
  mysql:
    image: mysql:8.4
    container_name: event-sync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-event_sync}
      MYSQL_USER: ${MYSQL_USER:-event_sync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-event_sync}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    image: mysql:8.4
    container_name: event-sync-migrate
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Applying /db/schema.sql..."
        mysql --protocol=TCP -h"$$MYSQL_HOST" -uroot -p"$$MYSQL_ROOT_PASSWORD" < /db/schema.sql
        echo "Migration complete."
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: event-sync-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-event_sync}:${MYSQL_PASSWORD:-event_sync}@mysql:3306/${MYSQL_DATABASE:-event_sync}
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: event-sync-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: npm run dev

volumes:
  mysql_data:
  frontend_node_modules:
